name: RAG CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: kmc173/rag-kubernetes-search

jobs:
  validate:
    name: Validate Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: python -m compileall app scripts

      - name: Import FastAPI app
        run: python -c "from app.main import app; print(app.title)"

  build_push_image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: sim_ai_review
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Hub secrets
        if: github.event_name == 'push'
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Missing DOCKERHUB_USERNAME repository secret"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Missing DOCKERHUB_TOKEN repository secret"; exit 1; }
          test "$DOCKERHUB_USERNAME" = "kmc173" || { echo "DOCKERHUB_USERNAME must be kmc173 because IMAGE_NAME is ${IMAGE_NAME}"; exit 1; }

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Calculate image version
        if: github.event_name == 'push'
        id: image_version
        run: |
          commit_count="$(git rev-list --count HEAD)"
          echo "version=v${commit_count}" >> "$GITHUB_OUTPUT"
          echo "Image version: v${commit_count}"

      - name: Docker metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=${{ steps.image_version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image on pull request
        if: github.event_name != 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rag-kubernetes-search:${{ github.sha }}

      - name: Build and push image to Docker Hub
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deployment review summary
        run: |
          mkdir -p artifacts
          {
            echo "# Deployment Review"
            echo
            echo "- Image repository: \`${{ env.IMAGE_NAME }}\`"
            echo "- Version tag: \`${{ steps.image_version.outputs.version || 'pull-request-build' }}\`"
            echo "- Commit tag: \`${{ github.sha }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Required runtime check: \`GET /health\`"
            echo "- Required data step: run \`POST /ingest\` after documentation changes"
          } > artifacts/deployment-review.md

      - name: Upload deployment review
        uses: actions/upload-artifact@v4
        with:
          name: deployment-review
          path: artifacts/deployment-review.md

  sim_ai_review:
    name: Sim AI Review
    runs-on: ubuntu-latest
    needs: validate
    env:
      SIM_AI_WEBHOOK_URL: ${{ secrets.SIM_AI_WEBHOOK_URL }}
      SIM_AI_AUTH_TOKEN: ${{ secrets.SIM_AI_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run simulated AI review
        run: python scripts/sim_ai_review.py

      - name: Add Sim AI review to workflow summary
        run: cat artifacts/sim-ai-review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Sim AI review
        uses: actions/upload-artifact@v4
        with:
          name: sim-ai-review
          path: artifacts/sim-ai-review.md

      - name: Send review to Sim.ai
        if: env.SIM_AI_WEBHOOK_URL != ''
        run: |
          test -n "$SIM_AI_AUTH_TOKEN" || { echo "Missing SIM_AI_AUTH_TOKEN repository secret because Sim.ai webhook authentication is enabled"; exit 1; }
          payload=$(jq -n \
            --rawfile report artifacts/sim-ai-review.md \
            --arg repository "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg sha "${{ github.sha }}" \
            '{
              repository: $repository,
              branch: $branch,
              sha: $sha,
              report: $report,
              agent_prompt: (
                "You are reviewing a GitHub Actions CI/CD report for a RAG Kubernetes documentation search project.\n\n" +
                "Repository: " + $repository + "\n" +
                "Branch: " + $branch + "\n" +
                "Commit SHA: " + $sha + "\n\n" +
                "Sim AI Review Report:\n" + $report + "\n\n" +
                "Return a short deployment decision in this exact format:\n\n" +
                "Status: Ready | Not Ready\n" +
                "Risk: Low | Medium | High\n" +
                "Docker image: Ready to publish | Not ready\n" +
                "Main finding: one short sentence\n" +
                "Next action: one short sentence"
              )
            }')
          curl -X POST \
            -H 'Content-type: application/json' \
            -H "Authorization: Bearer $SIM_AI_AUTH_TOKEN" \
            --data "$payload" \
            "$SIM_AI_WEBHOOK_URL"

  generate_release_notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    needs: build_push_image
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate release notes
        run: python scripts/generate_release_notes.py

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: artifacts/release-notes.md

  analyze_failure:
    name: Analyze Failure
    runs-on: ubuntu-latest
    needs:
      - validate
      - sim_ai_review
      - build_push_image
      - generate_release_notes
    if: failure()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate failure analysis
        run: python scripts/analyze_failure.py

      - name: Upload failure analysis
        uses: actions/upload-artifact@v4
        with:
          name: failure-analysis
          path: artifacts/failure-analysis.md

  notify_team:
    name: Notify Team
    runs-on: ubuntu-latest
    needs:
      - validate
      - sim_ai_review
      - build_push_image
      - generate_release_notes
      - analyze_failure
    if: always() && github.event_name == 'push'
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Prepare notification
        run: |
          echo "Workflow result: ${{ needs.validate.result }}, ${{ needs.sim_ai_review.result }}, ${{ needs.build_push_image.result }}, ${{ needs.generate_release_notes.result }}" > notification.txt
          cat notification.txt

      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          payload=$(jq -n \
            --arg text "RAG CI/CD completed for ${{ github.repository }} on ${{ github.ref_name }}. Validate: ${{ needs.validate.result }}. Sim AI: ${{ needs.sim_ai_review.result }}. Docker image: ${{ needs.build_push_image.result }}. Release notes: ${{ needs.generate_release_notes.result }}." \
            '{text: $text}')
          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
